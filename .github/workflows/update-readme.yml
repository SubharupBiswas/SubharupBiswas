name: Auto-Update Profile & Vector Stats

on:
  schedule:
    - cron: '30 18 * * *' # Runs automatically every night at 12:00 AM IST (18:30 UTC)
  workflow_dispatch: # Enables manual one-click updates from GitHub Actions tab

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Repos, Render SVGs & Query Gemini
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_readme.py

      - name: Commit and Push Assets & README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update profile README and vector assets" && git push)