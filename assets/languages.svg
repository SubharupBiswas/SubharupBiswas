<svg width="380" height="160" viewBox="0 0 380 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  
    <style>
      .card-bg { fill: #ffffff; stroke: #d0d7de; }
      .card-title { fill: #0969da; }
      .card-text { fill: #1f2328; }
      .card-subtext { fill: #656d76; }
      .divider { stroke: #d0d7de; }
      .bar-bg { fill: #eef1f4; }
      @media (prefers-color-scheme: dark) {
        .card-bg { fill: #0d1117; stroke: #30363d; }
        .card-title { fill: #58a6ff; }
        .card-text { fill: #c9d1d9; }
        .card-subtext { fill: #8b949e; }
        .divider { stroke: #21262d; }
        .bar-bg { fill: #21262d; }
      }
    </style>
    
  <rect class="card-bg" width="380" height="160" rx="12" stroke-width="1.5"/>
  <text class="card-title" x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600" font-size="18">📊 Top Technologies</text>
  <line class="divider" x1="25" y1="48" x2="355" y2="48" stroke-width="1"/>
  
        <text class="card-text" x="25" y="65" font-family="sans-serif" font-size="13">TypeScript</text>
        <rect class="bar-bg" x="130" y="55" width="160" height="8" rx="4"/>
        <rect x="130" y="55" width="105" height="8" rx="4" fill="#0969da"/>
        <text class="card-subtext" x="355" y="65" font-family="sans-serif" font-size="12" text-anchor="end">66%</text>
        
        <text class="card-text" x="25" y="90" font-family="sans-serif" font-size="13">Python</text>
        <rect class="bar-bg" x="130" y="80" width="160" height="8" rx="4"/>
        <rect x="130" y="80" width="25" height="8" rx="4" fill="#d4a72c"/>
        <text class="card-subtext" x="355" y="90" font-family="sans-serif" font-size="12" text-anchor="end">16%</text>
        
        <text class="card-text" x="25" y="115" font-family="sans-serif" font-size="13">CSS</text>
        <rect class="bar-bg" x="130" y="105" width="160" height="8" rx="4"/>
        <rect x="130" y="105" width="25" height="8" rx="4" fill="#cf222e"/>
        <text class="card-subtext" x="355" y="115" font-family="sans-serif" font-size="12" text-anchor="end">16%</text>
        
</svg>